[package]
name = "dz-print"
version = "0.1.0"
edition = "2024"
description = "Third-party USB/Bluetooth Driver for Detonger(detonger.com) Printing Machines"
authors = ["sbchild <sbchild0@gmail.com> <zinu5k7d1k2uzsxa@proton.me>"]
homepage = "https://github.com/sb-child/dz-print"
license = "MPL-2.0"

[dependencies]
btleplug = "0.13.5"
# bytebuffer = "2.3.0"
image = "0.25.10"
rusb = "0.9.4"
num-traits = "0.2"
# num-derive = "0.5"
# strum = { version = "0.28", features = ["derive"] }
rayon = "1.12.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
typst = { version = "0.15.1", optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-library = { version = "0.15.1", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
chrono = { version = "0.4.45", optional = true }
# typst-render currently using
tiny-skia = "=0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
], optional = true }
typst-render = { version = "0.15.1", optional = true }
spin = { version = "0.12.3", optional = true }
tempfile = { version = "3.27.0", optional = true }
ureq = { version = "3.5.0", optional = true }
tar = { version = "0.4.46", optional = true }
flate2 = { version = "1.1.10", optional = true }
deku = "0.20.3"
derive_aliases = "0.4.7"
pretty-hex = "0.4.2"
snafu = { version = "0.9.2", features = ["futures"] }
itoa = "1.0.18"
encoding_rs = "0.8.44"
crossfire = { version = "3.1.22", features = ["tokio"] }
mytm = { git = "https://github.com/sb-child/mytm", rev = "fd1b520d30f40c17905e375c8d1f1e17d02eb7c8" }
futures-util = "0.3.34"
tonic = { version = "0.14.9", optional = true }
prost = { version = "0.14.4", optional = true }
tokio-stream = { version = "0.1.19", optional = true }
async-stream = { version = "0.3.6", optional = true }
tonic-prost = { version = "0.14.9", optional = true }


[[bin]]
name = "dzcli"
required-features = ["bin-dzcli"]

[[bin]]
name = "dzprint_image"
required-features = ["bin-image"]

[[bin]]
name = "dzprint_typst"
required-features = ["bin-typst"]

[[bin]]
name = "test_usb"
required-features = ["bin-test-usb"]

[[bin]]
name = "dzserver"
required-features = ["bin-dzserver"]

[features]
default = ["bins"]

# 一次构建全部 bin；只想用一个时关掉默认特性再单独开对应 feature。
bins = ["bin-dzcli", "bin-image", "bin-typst", "bin-test-usb", "bin-dzserver"]

# 只需要库时用 `--no-default-features`。
bin-dzcli = ["dep:anyhow", "dep:clap", "dep:tracing-subscriber"]
bin-image = ["dep:anyhow", "dep:clap", "dep:tracing-subscriber"]
bin-typst = [
    "dep:anyhow",
    "dep:chrono",
    "dep:clap",
    "dep:flate2",
    "dep:spin",
    "dep:tar",
    "dep:tempfile",
    "dep:tracing-subscriber",
    "dep:ttf-parser",
    "dep:typst",
    "dep:typst-layout",
    "dep:typst-library",
    "dep:typst-render",
    "dep:ureq",
]
bin-test-usb = ["dep:anyhow", "dep:clap", "dep:tracing-subscriber"]
bin-dzserver = [
    "dep:anyhow",
    "dep:clap",
    "dep:tracing-subscriber",
    "dep:tonic",
    "dep:prost",
    "dep:tonic-prost",
    "dep:tokio-stream",
    "dep:async-stream",
    "dep:tonic-prost-build",
]

[build-dependencies]
tonic-prost-build = { version = "0.14.9", optional = true }

[profile.release]
opt-level = 2
debug = false
lto = true
panic = "abort"
codegen-units = 1
strip = true
